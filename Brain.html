<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="screen-orientation" content="portrait">
<meta name="x5-orientation" content="portrait">
<meta name="full-screen" content="yes">
<title>腦動波 BrainWave</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700;800&family=Noto+Sans+TC:wght@500;700;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous" defer></script>
<style>
:root {
  --sky-top: #5BA6FF;
  --sky-bottom: #DCEEFF;
  --bg: #F4F8FF;
  --panel: #FFFFFF;
  --line: #2D3748;
  --line-soft: #E2E8F0;
  --primary: #FF70A6;
  --primary-shadow: #D9467E;
  --mint: #48CA9B;
  --mint-dark: #2F9B73;
  --yellow: #FFD670;
  --yellow-shadow: #D9A836;
  --blue: #70B8FF;
  --blue-shadow: #438ED9;
  --purple: #B28DFF;
  --purple-shadow: #885FE0;
  --orange: #FF9770;
  --orange-shadow: #D9693E;
  --text: #2D3748;
  --subtext: #718096;
  --font-main: 'Fredoka', 'Noto Sans TC', -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; margin: 0; padding: 0; }
body, html {
  height: 100%;
  background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 100%);
  color: var(--text);
  font-family: var(--font-main);
  overflow: hidden;
  position: relative;
}

#orientationBlocker {
  display: none;
  position: fixed;
  inset: 0;
  background: #2D3748;
  color: #FFF;
  z-index: 99999;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 24px;
}
@media screen and (orientation: landscape) and (max-height: 480px) {
  #orientationBlocker { display: flex; }
}

.cloud-bg {
  position: absolute;
  background: rgba(255,255,255,0.7);
  border-radius: 50px;
  filter: blur(1px);
  pointer-events: none;
  animation: floatCloud linear infinite;
}
.cloud-1 { width: 140px; height: 45px; top: 8%; left: -150px; animation-duration: 26s; }
.cloud-2 { width: 180px; height: 60px; top: 22%; left: -200px; animation-duration: 38s; animation-delay: 8s; }
.cloud-3 { width: 120px; height: 40px; top: 65%; left: -130px; animation-duration: 30s; animation-delay: 15s; }
@keyframes floatCloud {
  0% { transform: translateX(0); }
  100% { transform: translateX(calc(100vw + 300px)); }
}

#app {
  height: 100%;
  display: flex;
  flex-direction: column;
  max-width: 440px;
  margin: 0 auto;
  position: relative;
  z-index: 2;
  padding-top: var(--safe-top);
  padding-bottom: var(--safe-bottom);
}

.bubbly-btn {
  background: var(--panel);
  border: 2.5px solid var(--line);
  border-radius: 18px;
  box-shadow: 0 4px 0 var(--line);
  color: var(--text);
  font-family: var(--font-main);
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: transform 0.1s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.1s;
}
.bubbly-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }

#splash {
  position: fixed;
  inset: 0;
  z-index: 999;
  background: var(--sky-bottom);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  padding: 0 30px;
  transition: opacity 0.45s ease;
}
#splash.hide { opacity: 0; pointer-events: none; }
.splash-logo-container {
  width: 170px;
  height: 170px;
  border-radius: 32px;
  border: 4px solid var(--line);
  box-shadow: 0 8px 0 var(--line);
  overflow: hidden;
  background: #FFD670;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.splash-logo-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.splash-badge {
  background: var(--line);
  color: #fff;
  padding: 8px 20px;
  border-radius: 14px;
  font-weight: 800;
  font-size: 15px;
  transform: rotate(-3deg);
  box-shadow: 0 4px 0 rgba(0,0,0,0.15);
}
.splash-bar-wrap {
  position: relative;
  width: 80%;
  max-width: 260px;
  height: 32px;
  background: #E2E8F0;
  border: 2.5px solid var(--line);
  border-radius: 20px;
  overflow: hidden;
}
.splash-bar-fill {
  position: absolute;
  top: 0; left: 0; bottom: 0;
  width: 0%;
  background: var(--primary);
  border-radius: 20px;
  transition: width 0.15s ease-out;
}
.splash-pct {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 13px;
  color: #fff;
}

.app-header {
  margin: 10px 14px 4px;
  padding: 8px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(255, 255, 255, 0.9);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 2.5px solid var(--line);
  border-radius: 22px;
  box-shadow: 0 4px 0 rgba(45, 55, 72, 0.15);
}
.app-logo { display: flex; align-items: center; gap: 10px; }
.logo-thumb-container {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  border: 2px solid var(--line);
  box-shadow: 0 2.5px 0 var(--line);
  overflow: hidden;
  background: #FFD670;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.logo-img-thumb {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.logo-text-wrap { display: flex; flex-direction: column; }
.logo-title { font-size: 17px; font-weight: 900; color: var(--text); line-height: 1.1; letter-spacing: -0.3px; }
.logo-subtitle { font-size: 10px; font-weight: 800; color: var(--primary); letter-spacing: 0.5px; }
.header-actions { display: flex; align-items: center; gap: 6px; }
.icon-btn { width: 36px; height: 36px; padding: 0; border-radius: 12px; }
.status-pill {
  background: var(--bg);
  border: 2px solid var(--line);
  border-radius: 12px;
  padding: 6px 10px;
  font-size: 11px;
  font-weight: 800;
  font-family: var(--font-mono);
  color: var(--text);
}

.story-banner {
  margin: 10px 14px 4px;
  background: linear-gradient(135deg, #FF70A6, #B28DFF);
  border: 2.5px solid var(--line);
  border-radius: 22px;
  padding: 14px 16px;
  color: #FFF;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 5px 0 var(--line);
  cursor: pointer;
  transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.story-banner:active { transform: translateY(3px); }
.story-title { font-size: 16px; font-weight: 900; letter-spacing: 0.5px; }
.story-desc { font-size: 11px; opacity: 0.92; margin-top: 2px; font-weight: 600; }

.tab-bar {
  display: flex;
  gap: 8px;
  padding: 8px 14px 4px;
  overflow-x: auto;
  scrollbar-width: none;
}
.tab-bar::-webkit-scrollbar { display: none; }
.tab-pill {
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 700;
  background: rgba(255, 255, 255, 0.7);
  border: 2px solid transparent;
  color: var(--subtext);
  white-space: nowrap;
  cursor: pointer;
  transition: all 0.2s;
}
.tab-pill.active {
  background: var(--panel);
  border-color: var(--line);
  color: var(--text);
  box-shadow: 0 2px 0 var(--line);
}

.games-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 8px 14px 28px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  align-content: start;
}
.games-scroll::-webkit-scrollbar { display: none; }

.game-card {
  background: var(--panel);
  border: 2.5px solid var(--line);
  border-radius: 22px;
  padding: 16px 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  cursor: pointer;
  box-shadow: 0 5px 0 var(--card-shadow, var(--line));
  transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.15s;
}
.game-card:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--card-shadow, var(--line)); }
.game-icon-bubble {
  width: 50px;
  height: 50px;
  border-radius: 16px;
  background: var(--card-color, var(--blue));
  border: 2px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 8px;
  box-shadow: 0 3px 0 var(--card-shadow, var(--blue-shadow));
}
.game-title { font-size: 14px; font-weight: 800; color: var(--text); margin-bottom: 2px; }
.game-tag { font-size: 11px; color: var(--subtext); font-weight: 600; }

#introModal {
  position: fixed;
  inset: 0;
  background: rgba(45, 55, 72, 0.6);
  backdrop-filter: blur(5px);
  z-index: 200;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
#introModal.show { display: flex; }
.intro-card {
  background: var(--panel);
  border: 3px solid var(--line);
  border-radius: 28px;
  padding: 24px 20px;
  width: 100%;
  max-width: 330px;
  box-shadow: 0 8px 0 var(--line);
  text-align: center;
  animation: popIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.intro-badge {
  display: inline-block;
  background: var(--yellow);
  border: 2px solid var(--line);
  border-radius: 12px;
  padding: 4px 12px;
  font-size: 12px;
  font-weight: 800;
  margin-bottom: 8px;
}
.diff-desc-box {
  background: var(--bg);
  border: 1.5px dashed var(--line);
  border-radius: 12px;
  padding: 8px 12px;
  font-size: 11.5px;
  color: var(--primary);
  font-weight: 800;
  margin-bottom: 14px;
}
.diff-selector { display: flex; gap: 8px; margin: 10px 0 16px; }
.diff-btn {
  flex: 1;
  padding: 8px 0;
  border-radius: 14px;
  border: 2px solid var(--line);
  background: var(--bg);
  font-size: 13px;
  font-weight: 800;
  cursor: pointer;
  transition: all 0.15s;
}
.diff-btn.active {
  background: var(--primary);
  color: #fff;
  box-shadow: 0 3px 0 var(--primary-shadow);
}

#musicModal {
  position: fixed;
  inset: 0;
  background: rgba(45, 55, 72, 0.6);
  backdrop-filter: blur(4px);
  z-index: 300;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
#musicModal.show { display: flex; }
.music-card {
  background: var(--panel);
  border: 3px solid var(--line);
  border-radius: 24px;
  padding: 20px;
  width: 100%;
  max-width: 320px;
  box-shadow: 0 6px 0 var(--line);
  text-align: center;
}

#stage {
  position: fixed;
  inset: 0;
  background: #EEF4FC;
  z-index: 100;
  display: none;
  flex-direction: column;
  padding-top: var(--safe-top);
  padding-bottom: var(--safe-bottom);
}
#stage.active { display: flex; }

.stage-hud {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  background: rgba(255,255,255,0.96);
  border-bottom: 2.5px solid var(--line);
}
.hud-section { display: flex; align-items: center; gap: 8px; }
.hud-pill {
  border: 2px solid var(--line);
  border-radius: 12px;
  padding: 4px 10px;
  font-size: 13px;
  font-weight: 800;
  font-family: var(--font-mono);
  display: flex;
  align-items: center;
  gap: 4px;
}
.pill-score { background: var(--yellow); box-shadow: 0 2px 0 var(--yellow-shadow); }
.pill-progress { background: var(--mint); color: #FFF; box-shadow: 0 2px 0 var(--mint-dark); }

.center-countdown-badge {
  display: none;
  align-items: center;
  justify-content: center;
  gap: 6px;
  background: #FFF;
  border: 2.5px solid var(--line);
  border-radius: 22px;
  padding: 6px 20px;
  font-family: var(--font-mono);
  font-size: 26px;
  font-weight: 900;
  color: var(--primary);
  box-shadow: 0 4px 0 var(--line);
  margin-bottom: 12px;
  animation: pulseBadge 1s infinite alternate;
}
.center-countdown-badge.active { display: inline-flex; }
@keyframes pulseBadge {
  0% { transform: scale(1); }
  100% { transform: scale(1.05); }
}

.stage-content {
  flex: 1;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  overflow: hidden;
}

.prompt-title {
  font-size: 15px;
  color: var(--subtext);
  font-weight: 700;
  margin-bottom: 10px;
  text-align: center;
}
.hero-display {
  font-size: 40px;
  font-weight: 900;
  margin-bottom: 18px;
  animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes popIn { 0% { transform: scale(0.6); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

#camCanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform: scaleX(-1);
  z-index: 1;
}
#camFeed { display: none; }
.cam-overlay {
  position: relative;
  z-index: 2;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  pointer-events: none;
}

.gyro-arena {
  width: 230px;
  height: 230px;
  border-radius: 50%;
  border: 3px solid var(--line);
  background: var(--panel);
  position: relative;
  box-shadow: inset 0 0 20px rgba(0,0,0,0.04);
}
.gyro-target {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: rgba(72, 202, 155, 0.3);
  border: 2px dashed var(--mint-dark);
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}
.gyro-ball {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--primary);
  border: 2.5px solid var(--line);
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  box-shadow: 0 3px 0 var(--primary-shadow);
}

.math-display-box {
  background: var(--panel);
  border: 2.5px solid var(--line);
  border-radius: 16px;
  padding: 10px 24px;
  font-family: var(--font-mono);
  font-size: 30px;
  font-weight: 800;
  margin-bottom: 16px;
  min-width: 220px;
  text-align: center;
  box-shadow: 0 3px 0 var(--line);
}
.numpad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  width: 100%;
  max-width: 260px;
}
.num-key {
  padding: 12px;
  font-size: 20px;
  background: var(--panel);
  border: 2px solid var(--line);
  border-radius: 14px;
  box-shadow: 0 3px 0 var(--line);
}

.tone-slots-wrap {
  display: flex;
  gap: 8px;
  margin: 14px 0 16px;
  justify-content: center;
}
.tone-slot {
  width: 60px;
  height: 60px;
  background: #FFF;
  border: 2.5px dashed var(--line);
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 800;
  font-family: var(--font-mono);
  color: var(--primary);
  box-shadow: 0 2px 0 var(--line-soft);
}
.tone-slot.filled {
  border-style: solid;
  border-color: var(--mint-dark);
  background: var(--bg);
  color: var(--text);
  box-shadow: 0 3px 0 var(--mint-dark);
}

.draw-box {
  background: var(--panel);
  border: 3px solid var(--line);
  border-radius: 24px;
  overflow: hidden;
  box-shadow: 0 4px 0 var(--line);
  touch-action: none;
}
#dCanvas {
  display: block;
  touch-action: none;
}

.result-box {
  text-align: center;
  background: var(--panel);
  border: 3px solid var(--line);
  border-radius: 28px;
  padding: 26px 20px;
  width: 90%;
  max-width: 320px;
  box-shadow: 0 6px 0 var(--line);
  animation: popIn 0.3s ease;
}
.result-score {
  font-size: 52px;
  font-weight: 900;
  color: var(--primary);
  margin: 10px 0 12px;
  font-family: var(--font-mono);
}

@keyframes fusionSuccess {
  0% { transform: scale(1); }
  50% { transform: scale(1.3) rotate(8deg); }
  100% { transform: scale(1); }
}
@keyframes shakeFail {
  0%, 100% { transform: translateX(0); }
  20%, 60% { transform: translateX(-8px); }
  40%, 80% { transform: translateX(8px); }
}
.fusion-ok { animation: fusionSuccess 0.4s ease-out; }
.fusion-fail { animation: shakeFail 0.35s ease-in-out; }

.flash-correct {
  animation: flashGreen 0.3s ease;
}
@keyframes flashGreen {
  0% { box-shadow: 0 0 0 0 rgba(72, 202, 155, 0.8); }
  70% { box-shadow: 0 0 25px 8px rgba(72, 202, 155, 0.9); }
  100% { box-shadow: 0 0 0 0 rgba(72, 202, 155, 0); }
}
</style>
</head>
<body>

<div id="orientationBlocker">
  <div style="font-size:42px; margin-bottom:12px;">📱</div>
  <div style="font-size:20px; font-weight:900; margin-bottom:8px;">請將手機轉為直向</div>
  <div style="font-size:14px; opacity:0.8;">腦動波專為直向單手操作設計，請轉回直向體驗最佳特訓！</div>
</div>

<div class="cloud-bg cloud-1"></div>
<div class="cloud-bg cloud-2"></div>
<div class="cloud-bg cloud-3"></div>

<div id="app">
  <div id="splash">
    <div class="splash-logo-container">
      <img id="splashImg" src="Brain_logo.png" alt="腦動波" class="splash-logo-img">
    </div>
    <div class="splash-badge">30 種不重複腦力特訓</div>
    <div class="splash-bar-wrap">
      <div class="splash-bar-fill" id="splashBarFill"></div>
      <div class="splash-pct" id="splashPct">0%</div>
    </div>
  </div>

  <header class="app-header">
    <div class="app-logo">
      <div class="logo-thumb-container">
        <img id="headerThumbImg" src="Brain_logo.png" alt="腦動波" class="logo-img-thumb">
      </div>
      <div class="logo-text-wrap">
        <span class="logo-title">腦動波</span>
        <span class="logo-subtitle">BRAINWAVE ARCADE</span>
      </div>
    </div>
    <div class="header-actions">
      <button class="bubbly-btn icon-btn" id="muteToggle" title="靜音切換">
        <svg id="muteIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
      </button>
      <button class="bubbly-btn icon-btn" id="musicBtn" title="音樂設定">

function shuffle(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function lockToPortrait() {
  try {
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock('portrait').catch(()=>{});
    } else if (screen.lockOrientation) {
      screen.lockOrientation('portrait');
    }
  } catch(e) {}
}
window.addEventListener('load', lockToPortrait);
document.addEventListener('click', lockToPortrait, { once: true });

const SafeStorage = {
  get: function(key, defaultVal) {
    try {
      const val = localStorage.getItem(key);
      return val !== null ? val : defaultVal;
    } catch(e) {
      return defaultVal;
    }
  },
  set: function(key, val) {
    try {
      localStorage.setItem(key, val);
    } catch(e) {}
  }
};

let consecutiveWins = parseInt(SafeStorage.get('bw_wins_v7', '0'));

function updateHeaderStat() {
  const el = document.getElementById('statBadge');
  if (el) el.textContent = `連續 ${consecutiveWins} 局`;
}
updateHeaderStat();

function clearAllTimers() {
  gameSessionId++;
  timers.forEach(t => {
    try {
      if (t && t.clear) t.clear();
      else clearTimeout(t);
    } catch(e) {}
  });
  timers = [];
  if (animFrame) {
    try { cancelAnimationFrame(animFrame); } catch(e) {}
    animFrame = null;
  }
}

function setHudProgress(txt) {
  const el = document.getElementById('progressText');
  if (el) el.textContent = txt;
}

function updateScore(s) {
  if (isStoryMode) {
    currentScore = Math.max(0, s);
  } else {
    currentScore = Math.min(100, Math.max(0, s));
  }
  const el = document.getElementById('scoreText');
  if (el) el.textContent = `${currentScore} 分`;
}

function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function pick(arr) { return arr[rand(0, arr.length - 1)]; }
function isPrime(n) {
  if (n < 2) return false;
  for (let i = 2; i * i <= n; i++) if (n % i === 0) return false;
  return true;
}

class SoundEngine {
  constructor() {
    this.ctx = null;
    this.masterGain = null;
    this.bgmGain = null;
    this.sfxGain = null;
    this.isMuted = false;
    this.bgmPlaying = false;
    this.bgmTimer = null;
    this.currentTrack = 0;
    
    this.tracks = [
      { 
        name: '曲目 1：陽光微風 (Sunny Breeze)', 
        type: 'sine',
        chords: [[261.63, 329.63, 392.00], [220.00, 261.63, 329.63], [174.61, 220.00, 261.63], [196.00, 246.94, 293.66]],
        arpeggio: [523.25, 659.25, 783.99, 659.25, 523.25, 392.00],
        tempo: 550,
        gainMult: 0.12
      },
      { 
        name: '曲目 2：深層專注 (Deep Focus)', 
        type: 'sine',
        chords: [[146.83, 174.61, 220.00], [130.81, 164.81, 196.00], [116.54, 146.83, 174.61], [110.00, 138.59, 164.81]],
        arpeggio: [293.66, 349.23, 440.00, 392.00, 293.66, 220.00],
        tempo: 800,
        gainMult: 0.14
      },
      { 
        name: '曲目 3：八音盒之夢 (Music Box Dream)', 
        type: 'triangle',
        chords: [[261.63, 392.00, 523.25], [293.66, 369.99, 440.00], [329.63, 392.00, 493.88], [261.63, 329.63, 392.00]],
        arpeggio: [659.25, 783.99, 1046.50, 783.99, 880.00, 523.25],
        tempo: 450,
        gainMult: 0.10
      },
      { 
        name: '曲目 4：像素復古波 (8-Bit Retro)', 
        type: 'square',
        chords: [[130.81, 196.00], [146.83, 220.00], [164.81, 246.94], [130.81, 196.00]],
        arpeggio: [261.63, 329.63, 392.00, 523.25, 392.00, 329.63],
        tempo: 360,
        gainMult: 0.08
      },
      { 
        name: '曲目 5：禪意靜心 (Zen Meditation)', 
        type: 'sine',
        chords: [[216.00, 324.00, 432.00], [192.00, 288.00, 384.00], [162.00, 243.00, 324.00], [216.00, 324.00, 432.00]],
        arpeggio: [432.00, 540.00, 648.00, 540.00],
        tempo: 900,
        gainMult: 0.15
      }
    ];
    this.step = 0;
  }

  init() {
    if (!this.ctx) {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) {
          this.ctx = new AudioCtx();
          this.masterGain = this.ctx.createGain();
          this.masterGain.gain.setValueAtTime(1, this.ctx.currentTime);
          this.masterGain.connect(this.ctx.destination);

          this.bgmGain = this.ctx.createGain();
          this.bgmGain.gain.setValueAtTime(0.12, this.ctx.currentTime);
          this.bgmGain.connect(this.masterGain);

          this.sfxGain = this.ctx.createGain();
          this.sfxGain.gain.setValueAtTime(0.35, this.ctx.currentTime);
          this.sfxGain.connect(this.masterGain);
        }
      } catch(e) {}
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      try { this.ctx.resume(); } catch(e) {}
    }
  }

  playSFX(freq = 440, type = 'sine', duration = 0.12) {
    if (this.isMuted) return;
    this.init();
    if (!this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
      gain.gain.setValueAtTime(1, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(this.sfxGain);
      osc.start();
      osc.stop(this.ctx.currentTime + duration);
      setTimeout(() => {
        try { osc.disconnect(); gain.disconnect(); } catch(e) {}
      }, (duration + 0.1) * 1000);
    } catch(e) {}
  }

  pop() { this.playSFX(620, 'sine', 0.06); }
  hit() { this.playSFX(880, 'triangle', 0.1); }
  fail() { this.playSFX(180, 'sawtooth', 0.2); }
  combo() { this.playSFX(1046, 'sine', 0.15); }
  zen(freq) { this.playSFX(freq || 432, 'sine', 0.5); }

  startBGM() {
    this.init();
    if (!this.ctx || this.bgmPlaying || this.isMuted) return;
    this.bgmPlaying = true;
    this.scheduleBGM();
  }

  scheduleBGM() {
    if (this.bgmTimer) clearInterval(this.bgmTimer);
    const trk = this.tracks[this.currentTrack];
    
    this.bgmTimer = setInterval(() => {
      if (!this.ctx || !this.bgmPlaying || this.isMuted) return;
      try {
        const chordIdx = Math.floor(this.step / trk.arpeggio.length) % trk.chords.length;
        const noteIdx = this.step % trk.arpeggio.length;

        if (noteIdx === 0) {
          trk.chords[chordIdx].forEach(f => {
            const osc = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(f, this.ctx.currentTime);
            g.gain.setValueAtTime(0.001, this.ctx.currentTime);
            g.gain.linearRampToValueAtTime(trk.gainMult * 0.8, this.ctx.currentTime + 0.3);
            g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + (trk.tempo * trk.arpeggio.length / 1000));
            osc.connect(g);
            g.connect(this.bgmGain);
            osc.start();
            osc.stop(this.ctx.currentTime + (trk.tempo * trk.arpeggio.length / 1000));
            setTimeout(() => {
              try { osc.disconnect(); g.disconnect(); } catch(e){}
            }, trk.tempo * trk.arpeggio.length + 100);
          });
        }

        const freq = trk.arpeggio[noteIdx];
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = trk.type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        g.gain.setValueAtTime(trk.gainMult, this.ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.45);
        osc.connect(g);
        g.connect(this.bgmGain);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.45);
        setTimeout(() => {
          try { osc.disconnect(); g.disconnect(); } catch(e){}
        }, 550);

        this.step++;
      } catch(e) {}
    }, trk.tempo);
  }

  nextTrack() {
    this.currentTrack = (this.currentTrack + 1) % this.tracks.length;
    this.step = 0;
    if (this.bgmPlaying) this.scheduleBGM();
    return this.tracks[this.currentTrack].name;
  }

  setVolume(pct) {
    if (!this.bgmGain) this.init();
    if (!this.ctx) return;
    const val = (pct / 100) * 0.22;
    try { this.bgmGain.gain.setValueAtTime(val, this.ctx.currentTime); } catch(e) {}
  }

  toggleMute() {
    this.init();
    this.isMuted = !this.isMuted;
    if (this.masterGain && this.ctx) {
      try {
        if (this.isMuted) {
          this.masterGain.gain.setValueAtTime(0, this.ctx.currentTime);
        } else {
          this.masterGain.gain.setValueAtTime(1, this.ctx.currentTime);
          if (!this.bgmPlaying) this.startBGM();
        }
      } catch(e) {}
    }
    return this.isMuted;
  }
}

(function initSplash() {
  const fill = document.getElementById('splashBarFill');
  const pct = document.getElementById('splashPct');
  const splash = document.getElementById('splash');
  let p = 0;

  function dismissSplash() {
    if (splash) {
      splash.classList.add('hide');
      setTimeout(() => { if (splash) splash.style.display = 'none'; }, 450);
    }
  }

  setTimeout(dismissSplash, 1200);

  const interval = setInterval(() => {
    p += rand(15, 25);
    if (p >= 100) { p = 100; clearInterval(interval); }
    if (fill) fill.style.width = p + '%';
    if (pct) pct.textContent = p + '%';
    if (p >= 100) {
      setTimeout(dismissSplash, 200);
    }
  }, 60);
})();

function setupLogoFallback(imgElement) {
  if (!imgElement) return;
  const paths = [
    'Brain_logo.png',
    'Brain_logo_2.jpg',
    'Brain_logo.jpg',
    '腦動波.jpg',
    'file:///android_asset/Brain_logo.png'
  ];
  let currentAttempt = 0;

  imgElement.onerror = function() {
    currentAttempt++;
    if (currentAttempt < paths.length) {
      imgElement.src = paths[currentAttempt];
    } else {
      imgElement.style.display = 'none';
      if (imgElement.parentElement) {
        imgElement.parentElement.innerHTML = `
          <div style="display:flex; align-items:center; justify-content:center; width:100%; height:100%; font-size:24px; font-weight:900; color:var(--line);">🧠</div>
        `;
      }
    }
  };
}

setupLogoFallback(document.getElementById('splashImg'));
setupLogoFallback(document.getElementById('headerThumbImg'));

function renderGrid(cat = 'all') {
  const grid = document.getElementById('gamesGrid');
  if (!grid) return;
  const list = cat === 'all' ? ALL_30_GAMES : ALL_30_GAMES.filter(g => g.cat === cat);
  grid.innerHTML = list.map(g => `
    <div class="game-card" data-id="${g.id}" style="--card-color:var(--${g.color}); --card-shadow:var(--${g.color}-shadow, var(--line));">
      <div class="game-icon-bubble">${g.icon}</div>
      <div class="game-title">${g.name}</div>
      <div class="game-tag">${g.brain}</div>
    </div>
  `).join('');

  grid.querySelectorAll('.game-card').forEach(c => {
    c.onclick = () => {
      sfx.pop();
      sfx.startBGM();
      showIntro(parseInt(c.dataset.id));
    };
  });
}

document.querySelectorAll('.tab-pill').forEach(pill => {
  pill.onclick = () => {
    sfx.pop();
    document.querySelectorAll('.tab-pill').forEach(p => p.classList.remove('active'));
    pill.classList.add('active');
    renderGrid(pill.dataset.filter);
  };
});

function updateDiffDesc() {
  if (currentGameData && currentGameData.diffDesc) {
    const el = document.getElementById('diffDescText');
    if (el) el.textContent = '難度特性：' + (currentGameData.diffDesc[currentDifficulty] || '');
  }
}

function showIntro(id) {
  const g = ALL_30_GAMES.find(x => x.id === id);
  if (!g) return;
  currentGameData = g;
  document.getElementById('introBrain').textContent = g.brain;
  document.getElementById('introTitle').textContent = g.name;
  document.getElementById('introDesc').textContent = g.desc;
  
  const diffFull = document.getElementById('diffFullContainer');
  if (isStoryMode) {
    if (diffFull) diffFull.style.display = 'none';
    document.getElementById('diffDescText').textContent = `冒險關卡 ${storyStep}/5：難度動態平衡`;
  } else {
    if (diffFull) diffFull.style.display = 'block';
    updateDiffDesc();
  }
  document.getElementById('introModal').classList.add('show');
}

document.getElementById('cancelIntroBtn').onclick = () => {
  document.getElementById('introModal').classList.remove('show');
  isStoryMode = false;
};

document.querySelectorAll('.diff-btn').forEach(btn => {
  btn.onclick = () => {
    sfx.pop();
    document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentDifficulty = btn.dataset.d;
    updateDiffDesc();
  };
});

document.getElementById('startPlayBtn').onclick = () => {
  document.getElementById('introModal').classList.remove('show');
  launchGame(currentGameData);
};

document.getElementById('storyBtn').onclick = () => {
  isStoryMode = true;
  storyStep = 0;
  currentScore = 0;
  currentDifficulty = 'normal';
  sfx.startBGM();
  sfx.combo();
  startNextStoryStage();
};

function startNextStoryStage() {
  storyStep++;
  if (storyStep > 5) {
    return gameOver(currentScore);
  }
  const storyPool = ALL_30_GAMES.filter(g => g.cat !== 'relax');
  const nextGame = pick(storyPool);
  currentGameData = nextGame;
  showIntro(nextGame.id);
}

const stage = document.getElementById('stage');
const stageInner = document.getElementById('stageInner');
document.getElementById('quitBtn').onclick = exitGame;

function launchGame(gameData) {
  clearAllTimers();
  if (!isStoryMode) {
    currentScore = 0;
    updateScore(0);
    setHudProgress('單項特訓');
  } else {
    setHudProgress(`第 ${storyStep}/5 關`);
    document.getElementById('scoreText').textContent = `${currentScore} 分`;
  }
  stage.classList.add('active');
  stageInner.innerHTML = '';
  
  try {
    if (ENGINES[gameData.type]) {
      ENGINES[gameData.type](gameData);
    } else {
      ENGINES.reactionClick(gameData);
    }
  } catch(e) {
    exitGame();
  }
}

function exitGame() {
  clearAllTimers();
  stopCamera();
  window.ondeviceorientation = null;
  stage.classList.remove('active');
  stageInner.innerHTML = '';
  isStoryMode = false;
}

function gameOver(finalScore) {
  clearAllTimers();
  stopCamera();
  window.ondeviceorientation = null;
  consecutiveWins += 1;
  SafeStorage.set('bw_wins_v7', consecutiveWins);
  updateHeaderStat();
  sfx.combo();

  const score = Math.max(0, Math.floor(finalScore));
  let rank = score >= (isStoryMode ? 400 : 85) ? 'S 級超載' : (score >= (isStoryMode ? 320 : 70) ? 'A 級思維' : 'B 級敏捷');

  stageInner.innerHTML = `
    <div class="result-box">

let handsModel = null, cameraObj = null;
function initHands(onResult) {
  return new Promise(resolve => {
    try {
      if (typeof Hands !== 'undefined' && !handsModel) {
        handsModel = new Hands({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
        handsModel.setOptions({ maxNumHands: 1, modelComplexity: 0, minDetectionConfidence: 0.6 });
      }
      if (handsModel) handsModel.onResults(onResult);
      resolve(true);
    } catch(e) { resolve(false); }
  });
}
function startCamera(videoEl) {
  return new Promise(resolve => {
    try {
      if (typeof Camera !== 'undefined' && videoEl) {
        cameraObj = new Camera(videoEl, {
          onFrame: async () => { if (handsModel) await handsModel.send({ image: videoEl }); },
          width: 320, height: 240
        });
        cameraObj.start().then(() => resolve(true)).catch(() => resolve(false));
      } else resolve(false);
    } catch(e) { resolve(false); }
  });
}
function stopCamera() {
  try { if (cameraObj && cameraObj.stop) cameraObj.stop(); } catch(e){}
  cameraObj = null;
}
function classifyHand(lm) {
  const tips = [4, 8, 12, 16, 20], pips = [3, 6, 10, 14, 18];
  const ext = tips.map((t, i) => i === 0 ? Math.abs(lm[t].x - lm[0].x) > Math.abs(lm[pips[i]].x - lm[0].x) : lm[t].y < lm[pips[i]].y);
  if (ext[0] && !ext[1] && !ext[2] && !ext[3] && !ext[4]) return 'thumb';
  if (ext[1] && ext[2] && !ext[3] && !ext[4]) return 'peace';
  if (ext[1] && ext[2] && ext[3] && ext[4]) return 'palm';
  return null;
}

      if (gameSessionId !== currentSession) return;
      x += vx; y += vy;

      const d = Math.hypot(x, y);

        const a = Math.atan2(y, x);
        x = Math.cos(a) * 100; y = Math.sin(a) * 100;
      }
      if (ball) ball.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
      animFrame = requestAnimationFrame(tick);

  drawCombined: () => {
    const currentSession = gameSessionId;
    const SHAPES = [
      { id: 'circle', name: '正圓形' },
      { id: 'square', name: '正方形' },
      { id: 'triangle', name: '等邊三角形' },
      { id: 'star', name: '五角星' }

    const target = pick(SHAPES);

    stageInner.innerHTML = `
      <div class="prompt-title">繪製封印：<b style="color:var(--primary); font-size:18px;">${target.name}</b></div>
      <div class="draw-box"><canvas id="dCanvas" width="240" height="240"></canvas></div>
      <button class="bubbly-btn" id="dEval" style="margin-top:18px; padding:12px 28px; background:var(--mint); color:#FFF; box-shadow:0 4px 0 var(--mint-dark);">評定精確度</button>
    `;

    const cvs = document.getElementById('dCanvas');
    if (!cvs) return;
    const ctx = cvs.getContext('2d');
    let pts = [], drawing = false;
    ctx.strokeStyle = '#FF70A6'; ctx.lineWidth = 6; ctx.lineCap = 'round';

    function getCoords(e) {
      const rect = cvs.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (clientX - rect.left) * (cvs.width / rect.width),
        y: (clientY - rect.top) * (cvs.height / rect.height)
      };
    }

    function handleStart(e) {
      if (gameSessionId !== currentSession) return;
      e.preventDefault();
      drawing = true;
      pts = [];
      ctx.clearRect(0, 0, cvs.width, cvs.height);
      const pos = getCoords(e);
      pts.push(pos);
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
    }

    function handleMove(e) {
      if (gameSessionId !== currentSession || !drawing) return;
      e.preventDefault();
      const pos = getCoords(e);
      pts.push(pos);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    }

    function handleEnd(e) {
      if (gameSessionId !== currentSession) return;
      e.preventDefault();
      drawing = false;
    }

    cvs.addEventListener('touchstart', handleStart, { passive: false });
    cvs.addEventListener('touchmove', handleMove, { passive: false });
    cvs.addEventListener('touchend', handleEnd, { passive: false });

    cvs.addEventListener('mousedown', handleStart);
    window.addEventListener('mousemove', handleMove);
    window.addEventListener('mouseup', handleEnd);

    document.getElementById('dEval').onclick = () => {
      if (gameSessionId !== currentSession) return;
      if (pts.length < 15) return;
      let minX = 999, maxX = -999, minY = 999, maxY = -999, ax = 0, ay = 0;
      pts.forEach(p => {
        ax += p.x; ay += p.y;
        minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
        minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y);
      });
      ax /= pts.length; ay /= pts.length;
      const aspect = Math.min(maxX - minX, maxY - minY) / Math.max(maxX - minX, maxY - minY);

      let calcScore = 0;
      if (target.id === 'circle') {
        const rads = pts.map(p => Math.hypot(p.x - ax, p.y - ay));
        const avgR = rads.reduce((a,b)=>a+b,0)/rads.length;
        const variance = rads.reduce((a,b)=>a + Math.pow(b - avgR, 2), 0) / rads.length;
        const penalty = currentDifficulty === 'hard' ? 4.8 : (currentDifficulty === 'normal' ? 3.4 : 2.2);
        calcScore = Math.min(100, Math.max(20, Math.floor(100 - Math.sqrt(variance) * penalty)));
      } else if (target.id === 'square') {
        const penalty = currentDifficulty === 'hard' ? 95 : 85;
        calcScore = Math.min(100, Math.max(20, Math.floor(aspect * penalty)));
      } else {
        calcScore = currentDifficulty === 'hard' ? rand(55, 82) : rand(70, 95);
      }

      const initialBase = isStoryMode ? currentScore : 0;
      updateScore(initialBase + calcScore);
      if (isStoryMode) startNextStoryStage(); else gameOver(calcScore);
    };
  },

      el.style.left = rand(15, 75) + '%';
      lane.appendChild(el);
      items.push({ el, n, y: -60, cut: false });
    }

    const spawner = setInterval(() => {
      spawnNext();
      if (queue.length === 0) clearInterval(spawner);
    }, currentDifficulty === 'hard' ? 850 : 1100);
    timers.push({ clear: () => clearInterval(spawner) });

    function handleSliceAt(clientX, clientY) {
      if (gameSessionId !== currentSession) return;
      const rect = lane.getBoundingClientRect();
      const px = clientX - rect.left, py = clientY - rect.top;
      items.forEach(item => {
        if (item.cut) return;
        const r = item.el.getBoundingClientRect();
        if (Math.hypot(px - (r.left - rect.left + 28), py - (r.top - rect.top + 28)) < 38) {
          item.cut = true;
          item.el.remove();
          processed++;
          setHudProgress(`${processed}/${totalCount}`);
          if (isPrime(item.n)) {
            gainedScore = Math.min(100, gainedScore + 10);
            sfx.hit();
          } else {
            gainedScore = Math.max(0, gainedScore - 8);
            sfx.fail();
          }
          updateScore(initialBase + gainedScore);
          if (processed >= totalCount) {
            if (isStoryMode) startNextStoryStage(); else gameOver(gainedScore);
          }
        }
      });
    }

    lane.addEventListener('touchmove', (e) => {
      e.preventDefault();
      handleSliceAt(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: false });
    lane.addEventListener('mousemove', (e) => handleSliceAt(e.clientX, e.clientY));

    function tick() {
      if (gameSessionId !== currentSession) return;
      items.forEach(item => {
        if (item.cut) return;
        item.y += speed;
        item.el.style.top = item.y + 'px';
        if (item.y > lane.clientHeight - 60) {
          item.cut = true;
          item.el.remove();
          processed++;
          setHudProgress(`${processed}/${totalCount}`);
          if (processed >= totalCount) {
            if (isStoryMode) startNextStoryStage(); else gameOver(gainedScore);
          }
        }
      });
      if (processed < totalCount) animFrame = requestAnimationFrame(tick);
    }
    tick();
  },

    const currentSession = gameSessionId;

    const rStage = document.getElementById('rStage');

    const initialBase = isStoryMode ? currentScore : 0;
    let baseSpeed = currentDifficulty === 'hard' ? 3.0 : 2.0;

    function spawnNote() {
      if (gameSessionId !== currentSession) return;
      if (noteCount <= 0) return;
      noteCount--;
      const isLong = Math.random() > 0.65;
      const height = isLong ? 90 : 44;
      const el = document.createElement('div');
      el.style.cssText = `position:absolute; left:94px; top:-${height}px; width:52px; height:${height}px; border-radius:14px; background:${isLong ? 'var(--purple)' : 'var(--primary)'}; border:2.5px solid var(--line); box-shadow:0 3px 0 rgba(0,0,0,0.15); overflow:hidden;`;
      if (isLong) {
        el.innerHTML = `<div class="hold-fill" style="width:100%; height:0%; background:var(--mint); transition:height 0.1s linear;"></div>`;
      }
      if (rStage) rStage.appendChild(el);
      notes.push({ el, y: -height, height, isLong, holding: false, hit: false });
    }
    const spawner = setInterval(spawnNote, 1100);
    timers.push({ clear: () => clearInterval(spawner) });

    const hitBtn = document.getElementById('hitBtn');
    let activeHoldNote = null;

    if (hitBtn) {
      hitBtn.onpointerdown = () => {
        if (gameSessionId !== currentSession) return;
        const targetY = 246;
        let closest = null, minDiff = 999;
        notes.forEach(n => {
          if (n.hit) return;
          const diff = Math.abs((n.y + n.height/2) - targetY);
          if (diff < minDiff) { minDiff = diff; closest = n; }
        });

        if (closest && minDiff < 45) {
          if (closest.isLong) {
            closest.holding = true;
            activeHoldNote = closest;
            closest.el.style.boxShadow = '0 0 16px 4px var(--mint)';
            sfx.zen(440);
          } else {
            closest.hit = true;
            closest.el.remove();
            finished++;
            gainedScore = Math.min(100, gainedScore + 10);
            updateScore(initialBase + gainedScore);
            sfx.hit();
            if (finished >= 12) {
              if (isStoryMode) startNextStoryStage(); else gameOver(gainedScore);
            }
          }
        }
      };

      hitBtn.onpointerup = () => {
        if (gameSessionId !== currentSession) return;
        if (activeHoldNote && activeHoldNote.holding) {
          activeHoldNote.holding = false;
          if (activeHoldNote.y + activeHoldNote.height >= 246) {
            activeHoldNote.hit = true;
            activeHoldNote.el.remove();
            finished++;
            gainedScore = Math.min(100, gainedScore + 12);
            updateScore(initialBase + gainedScore);
            sfx.combo();
          } else {
            activeHoldNote.hit = true;
            activeHoldNote.el.remove();
            finished++;
            gainedScore = Math.max(0, gainedScore - 8);
            updateScore(initialBase + gainedScore);
            sfx.fail();
          }
          activeHoldNote = null;
          if (finished >= 12) {
            if (isStoryMode) startNextStoryStage(); else gameOver(gainedScore);
          }
        }
      };
    }

    function tick() {
      if (gameSessionId !== currentSession) return;
      baseSpeed += 0.002;
      notes.forEach(n => {
        if (n.hit) return;
        n.y += baseSpeed;
        n.el.style.top = n.y + 'px';

        if (n.holding && n.isLong) {
          const fill = n.el.querySelector('.hold-fill');
          if (fill) fill.style.height = '100%';
        }

        if (n.y > 310) {
          n.hit = true;
          n.el.remove();
          finished++;
          gainedScore = Math.max(0, gainedScore - 8);
          updateScore(initialBase + gainedScore);
          sfx.fail();
          if (finished >= 12) {
            if (isStoryMode) startNextStoryStage(); else gameOver(gainedScore);
          }
        }
      });
      if (finished < 12) animFrame = requestAnimationFrame(tick);
    }
    tick();
  },

  ringOverlap: () => {
    const currentSession = gameSessionId;
    let rounds = 10, cur = 0, gainedScore = 0;
    const initialBase = isStoryMode ? currentScore : 0;
    const tolerance = currentDifficulty === 'hard' ? 12 : (currentDifficulty === 'normal' ? 20 : 30);

        return;
      }
      cur++;
      setHudProgress(`${cur}/${rounds}`);

      let moveMode = 'horizontal';
      if (currentDifficulty === 'normal') {
        moveMode = Math.random() > 0.5 ? 'horizontal' : 'vertical';
      } else if (currentDifficulty === 'hard') {
        moveMode = pick(['horizontal', 'vertical', 'diagonal']);
      }

      stageInner.innerHTML = `
        <div class="prompt-title">當兩枚光環完全重合的瞬間點擊！</div>
        <div style="width:240px; height:240px; position:relative; background:#FFF; border:2.5px solid var(--line); border-radius:22px; overflow:hidden;" id="ringArena">
          <div id="targetRing" style="position:absolute; left:95px; top:95px; width:50px; height:50px; border-radius:50%; border:3.5px solid var(--primary); transition:all 0.1s;"></div>
          <div id="movingRing" style="position:absolute; left:0px; top:95px; width:50px; height:50px; border-radius:50%; border:3.5px solid var(--mint-dark); transition:box-shadow 0.1s;"></div>
        </div>
        <button class="bubbly-btn" id="ringTapBtn" style="margin-top:16px; padding:12px 36px; font-size:16px; background:var(--blue); color:#FFF;">重合點擊！</button>
      `;

      const mRing = document.getElementById('movingRing');
      const tRing = document.getElementById('targetRing');
      let pos = 0, speed = (currentDifficulty === 'hard' ? 3.6 : 2.4);

      function ringTick() {
        if (gameSessionId !== currentSession) return;
        pos += speed;
        if (pos > 190 || pos < 0) speed = -speed;

        if (mRing) {
          if (moveMode === 'horizontal') {
            mRing.style.left = pos + 'px';
            mRing.style.top = '95px';
          } else if (moveMode === 'vertical') {
            mRing.style.left = '95px';
            mRing.style.top = pos + 'px';
          } else {
            mRing.style.left = pos + 'px';
            mRing.style.top = pos + 'px';
          }

          const isOverlapping = Math.abs(pos - 95) < tolerance;
          if (isOverlapping) {
            mRing.style.borderColor = '#FFD670';
            mRing.style.boxShadow = '0 0 16px 4px #FFD670';
            if (tRing) {
              tRing.style.borderColor = '#FFD670';
              tRing.style.boxShadow = '0 0 16px 4px #FFD670';
            }
          } else {
            mRing.style.borderColor = 'var(--mint-dark)';
            mRing.style.boxShadow = 'none';
            if (tRing) {
              tRing.style.borderColor = 'var(--primary)';
              tRing.style.boxShadow = 'none';
            }
          }
        }
        animFrame = requestAnimationFrame(ringTick);
      }
      ringTick();

      const tapBtn = document.getElementById('ringTapBtn');
      if (tapBtn) {
        tapBtn.onpointerdown = () => {
          if (gameSessionId !== currentSession) return;
          const diff = Math.abs(pos - 95);
          if (diff < tolerance) {
            gainedScore += 10;
            sfx.hit();
            tapBtn.style.background = 'var(--yellow)';
            tapBtn.style.color = 'var(--text)';
            tapBtn.style.boxShadow = '0 2px 0 var(--yellow-shadow)';
          } else {
            sfx.fail();
            tapBtn.style.background = 'var(--blue)';
            tapBtn.style.color = '#FFF';
          }
          updateScore(initialBase + gainedScore);
          setTimeout(next, 300);
        };
      }
    }
    next();
  },

  camFingerTrace: () => {
    const currentSession = gameSessionId;
    stageInner.innerHTML = `
      <video id="camFeed" autoplay playsinline muted></video>
      <canvas id="camCanvas"></canvas>
      <div class="cam-overlay">
        <div class="prompt-title" style="background:rgba(255,255,255,0.85); padding:6px 14px; border-radius:12px; border:2px solid var(--line); margin-top:10px;">
          用食指指尖跟隨空中移動的光圈！
        </div>
      </div>
    `;
    const video = document.getElementById('camFeed');
    const canvas = document.getElementById('camCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let t = 0, gainedScore = 0;
    const initialBase = isStoryMode ? currentScore : 0;
    const speed = currentDifficulty === 'hard' ? 0.05 : (currentDifficulty === 'normal' ? 0.03 : 0.02);
    const radius = currentDifficulty === 'hard' ? 22 : 28;
    canvas.width = stageInner.clientWidth || 320;
    canvas.height = stageInner.clientHeight || 480;

    let fingerPos = null;
    initHands(results => {
      if (gameSessionId !== currentSession) return;
      if (results.multiHandLandmarks && results.multiHandLandmarks.length) {
        const lm = results.multiHandLandmarks[0];
        fingerPos = { x: (1 - lm[8].x) * canvas.width, y: lm[8].y * canvas.height };
      }
    }).then(() => {
      if (video) startCamera(video);
    });

    stageInner.onpointermove = (e) => {
      const rect = canvas.getBoundingClientRect();
      fingerPos = { x: e.clientX - rect.left, y: e.clientY - rect.top };
    };

    function renderTrace() {
      if (gameSessionId !== currentSession) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      t += speed;
      const targetX = canvas.width/2 + Math.sin(t) * 90;
      const targetY = canvas.height/2 + Math.cos(t * 1.5) * 60;

      ctx.beginPath();
      ctx.arc(targetX, targetY, radius, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(72, 202, 155, 0.4)';
      ctx.strokeStyle = '#2D3748';
      ctx.lineWidth = 3;
      ctx.fill(); ctx.stroke();

      if (fingerPos && Math.hypot(fingerPos.x - targetX, fingerPos.y - targetY) < radius + 8) {
        gainedScore = Math.min(100, gainedScore + 1);
        updateScore(initialBase + gainedScore);
      }
      if (t > 4) {
        if (isStoryMode) startNextStoryStage(); else gameOver(gainedScore);
      } else animFrame = requestAnimationFrame(renderTrace);
    }
    renderTrace();
  },

    function onOrient(e) {
      if (gameSessionId !== currentSession) return;
      vx += (e.gamma || 0) * sens;
      vy += ((e.beta || 45) - 45) * sens;
    }
    window.addEventListener('deviceorientation', onOrient);

    function tick() {
      if (gameSessionId !== currentSession) return;
      x += vx; y += vy;
      vx *= 0.92; vy *= 0.92;
      if (ball) {
        ball.style.left = x + 'px';
        ball.style.top = y + 'px';

      if (Math.hypot(x - 200, y - 30) < 30) {
        window.removeEventListener('deviceorientation', onOrient);
        const initialBase = isStoryMode ? currentScore : 0;
        updateScore(initialBase + 100);
        if (isStoryMode) startNextStoryStage(); else gameOver(100);
      } else animFrame = requestAnimationFrame(tick);

    stageInner.innerHTML = `
      <div class="prompt-title">翻開隱藏卡片，完成配對！</div>
      <div style="display:grid; grid-template-columns:repeat(${cards.length > 6 ? 4 : (cards.length > 4 ? 3 : 2)},${cards.length > 6 ? '64px':'80px'}); gap:10px;">
        ${cards.map((c, i) => `<button class="bubbly-btn card-btn" data-i="${i}" data-c="${c}" style="height:${cards.length > 6 ? '64px':'80px'}; font-size:20px;">?</button>`).join('')}
      </div>
    `;
    stageInner.querySelectorAll('.card-btn').forEach(b => {
      b.onclick = () => {
        if (gameSessionId !== currentSession) return;
        if (b.textContent !== '?' || flipped.length >= 2) return;
        b.textContent = b.dataset.c;
        sfx.pop();
        flipped.push(b);
        if (flipped.length === 2) {
          if (flipped[0].dataset.c === flipped[1].dataset.c) {
            sfx.hit();
            matched += 2;
            flipped = [];
            if (matched >= cards.length) {
              const initialBase = isStoryMode ? currentScore : 0;
              updateScore(initialBase + 100);
              if (isStoryMode) startNextStoryStage(); else gameOver(100);
            }
          } else {
            setTimeout(() => {
              if (gameSessionId !== currentSession) return;
              if (flipped[0]) flipped[0].textContent = '?';
              if (flipped[1]) flipped[1].textContent = '?';
              flipped = [];
            }, 600);
          }
        }
      };
    });
  },

  memoryFlipMaster: () => {
    const currentSession = gameSessionId;
    const dim = currentDifficulty === 'hard' ? 4 : 3;
    const total = dim * dim;
    const highlightCount = currentDifficulty === 'hard' ? 6 : (currentDifficulty === 'normal' ? 4 : 3);
    let targets = [];
    while (targets.length < highlightCount) {
      const idx = rand(0, total - 1);
      if (!targets.includes(idx)) targets.push(idx);
    }

    stageInner.innerHTML = `
      <div class="prompt-title">記住瞬間亮起的 ${highlightCount} 個方塊！</div>
      <div style="display:grid; grid-template-columns:repeat(${dim},${dim===4?'54px':'68px'}); gap:10px;" id="mMatrix">
        ${Array(total).fill(0).map((_, i) => `<div class="bubbly-btn m-cell" data-i="${i}" style="height:${dim===4?'54px':'68px'}; ${targets.includes(i)?'background:var(--yellow);':''}"></div>`).join('')}
      </div>
    `;

    setTimeout(() => {
      if (gameSessionId !== currentSession) return;
      stageInner.querySelectorAll('.m-cell').forEach(c => c.style.background = 'var(--panel)');
      let userClicked = [];
      stageInner.querySelectorAll('.m-cell').forEach(cell => {
        cell.onclick = () => {
          if (gameSessionId !== currentSession) return;
          const idx = parseInt(cell.dataset.i);
          if (!userClicked.includes(idx)) {
            userClicked.push(idx);
            cell.style.background = targets.includes(idx) ? 'var(--mint)' : 'var(--primary)';
            if (targets.includes(idx)) sfx.hit(); else sfx.fail();

            if (userClicked.length >= highlightCount) {
              let correct = userClicked.filter(x => targets.includes(x)).length;
              const score = Math.floor((correct / highlightCount) * 100);
              const initialBase = isStoryMode ? currentScore : 0;
              updateScore(initialBase + score);
              setTimeout(() => {
                if (gameSessionId !== currentSession) return;
                if (isStoryMode) startNextStoryStage(); else gameOver(score);
              }, 400);
            }
          }
        };
      });
    }, currentDifficulty === 'hard' ? 650 : 1000);
  },

  coreAwaken: () => {
    const currentSession = gameSessionId;
    let rounds = 10, cur = 0, gainedScore = 0;
    const initialBase = isStoryMode ? currentScore : 0;

    function next() {
      if (gameSessionId !== currentSession) return;
      if (cur >= rounds) {
        if (isStoryMode) startNextStoryStage(); else gameOver(gainedScore);
        return;
      }
      cur++;
      setHudProgress(`${cur}/${rounds}`);

      let qText, ans, opts;
      if (currentDifficulty === 'easy') {
        const a = rand(10, 50), b = rand(10, 50);
        qText = `${a} + ${b} = ?`; ans = a + b;
        opts = shuffle([ans - 5, ans, ans + 8]);
      } else if (currentDifficulty === 'normal') {
        const a = rand(10, 40), b = rand(5, 30), c = rand(2, 15);
        qText = `${a} + ${b} - ${c} = ?`; ans = a + b - c;
        opts = shuffle([ans - 4, ans, ans + 6]);
      } else {
        const a = rand(3, 9), b = rand(4, 9), c = rand(10, 30);
        qText = `${a} × ${b} - ${c} = ?`; ans = a * b - c;
        opts = shuffle([ans - 3, ans, ans + 5]);
      }

      stageInner.innerHTML = `
        <div class="prompt-title">第 ${cur} / ${rounds} 題全腦運算：${qText}</div>
        <div class="hero-display" style="font-size:32px;">${qText.replace('= ?', '')}</div>
        <div style="display:flex; gap:12px;">
          ${opts.map(n => `<button class="bubbly-btn core-btn" data-n="${n}" style="padding:14px 22px; font-size:18px;">${n}</button>`).join('')}
        </div>
      `;
      stageInner.querySelectorAll('.core-btn').forEach(b => {
        b.onclick = () => {
          if (gameSessionId !== currentSession) return;
          if (parseInt(b.dataset.n) === ans) {
            gainedScore += 10;
            sfx.hit();
          } else sfx.fail();
          updateScore(initialBase + gainedScore);
          setTimeout(next, 250);
        };
      });
    }
    next();
  }
};
</script>
</body>
</html>
