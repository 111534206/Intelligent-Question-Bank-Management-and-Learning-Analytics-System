
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧題庫管理與學習分析系統</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.47.0/iconfont/tabler-icons.min.css">
<style>
  :root{
    --teal-900:#04342C;
    --teal-800:#085041;
    --teal-600:#0F6E56;
    --teal-500:#279E7C;
    --teal-400:#1D9E75;
    --teal-200:#5DCAA5;
    --teal-100:#9FE1CB;
    --teal-50:#E1F5EE;
    --header-bg:#4FB899;
    --header-text:#053225;
    --blue-800:#0C447C;
    --blue-600:#185FA5;
    --blue-400:#378ADD;
    --blue-100:#B5D4F4;
    --blue-50:#E6F1FB;
    --amber-50:#FAEEDA;
    --amber-600:#854F0B;
    --red-50:#FCEBEB;
    --red-600:#A32D2D;
    --ink:#1c2624;
    --ink-soft:#5b6a67;
    --ink-mute:#8a9895;
    --line:#d9e4e1;
    --bg-page:#f3f7f6;
    --bg-card:#ffffff;
    --radius:10px;
    --font: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font);
    background:var(--bg-page);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .app{
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }

  /* ---------- Header ---------- */
  header.topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 28px;
    height:76px;
    background:var(--header-bg);
    color:var(--header-text);
    flex-shrink:0;
    position:sticky;
    top:0;
    z-index:20;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:16px;
    font-weight:500;
    letter-spacing:0.2px;
  }
  .brand i{font-size:22px;color:var(--teal-800);}
  .role-switcher{
    display:flex;
    gap:4px;
    background:rgba(4,52,44,0.08);
    padding:5px;
    border-radius:999px;
  }
  .role-btn{
    border:none;
    background:transparent;
    color:rgba(4,52,44,0.6);
    font-size:13px;
    padding:8px 18px;
    border-radius:999px;
    cursor:pointer;
    font-family:var(--font);
    transition:background 0.15s, color 0.15s;
  }
  .role-btn.active{
    background:#ffffff;
    color:var(--teal-800);
    font-weight:500;
  }
  .role-btn:hover:not(.active){
    color:var(--teal-900);
  }
  .topbar-right{
    display:flex;
    align-items:center;
    gap:20px;
  }
  .icon-btn{
    font-size:19px;
    color:var(--teal-900);
    opacity:0.7;
    cursor:pointer;
    position:relative;
  }
  .icon-btn .dot{
    position:absolute;
    top:-2px;right:-2px;
    width:7px;height:7px;
    background:#F2A623;
    border-radius:50%;
    border:1.5px solid var(--header-bg);
  }
  .user-chip{
    display:flex;
    align-items:center;
    gap:9px;
    font-size:13px;
    cursor:pointer;
    padding:6px 10px 6px 6px;
    border-radius:999px;
    transition:background 0.15s;
  }
  .user-chip:hover{background:rgba(4,52,44,0.08);}
  .avatar{
    width:32px;height:32px;
    border-radius:50%;
    background:var(--teal-800);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:500;
    flex-shrink:0;
  }

  /* ---------- Body layout ---------- */
  .body-wrap{
    display:flex;
    flex:1;
  }
  aside.sidebar{
    width:208px;
    background:#fff;
    border-right:1px solid var(--line);
    flex-shrink:0;
    padding:16px 0;
  }
  .side-section-label{
    font-size:11px;
    color:var(--ink-mute);
    padding:4px 20px 8px;
    letter-spacing:0.4px;
  }
  .nav-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 20px;
    font-size:13.5px;
    color:var(--ink-soft);
    cursor:pointer;
    border-left:3px solid transparent;
    white-space:nowrap;
  }
  .nav-item i{font-size:17px;width:18px;text-align:center;flex-shrink:0;}
  .nav-item:hover{background:var(--teal-50);color:var(--teal-900);}
  .nav-item.active{
    background:var(--teal-50);
    color:var(--teal-800);
    border-left-color:var(--teal-600);
    font-weight:500;
  }
  .nav-note{
    font-size:10.5px;
    color:var(--ink-mute);
    margin-left:auto;
    background:var(--amber-50);
    color:var(--amber-600);
    padding:1px 6px;
    border-radius:999px;
  }

  main.content{
    flex:1;
    padding:24px 32px 48px;
    min-width:0;
  }
  .panel{display:none;}
  .panel.active{display:block;}

  .page-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
    flex-wrap:wrap;
    gap:10px;
  }
  .page-head h1{
    font-size:19px;
    font-weight:500;
    margin:0;
    color:var(--ink);
  }
  .page-sub{
    font-size:12.5px;
    color:var(--ink-mute);
    margin-top:2px;
  }

  button.primary{
    background:var(--teal-600);
    color:#fff;
    border:none;
    font-size:13px;
    padding:8px 16px;
    border-radius:8px;
    cursor:pointer;
    display:flex;align-items:center;gap:6px;
    font-family:var(--font);
  }
  button.primary:hover{background:var(--teal-800);}
  button.ghost{
    background:#fff;
    color:var(--ink-soft);
    border:1px solid var(--line);
    font-size:13px;
    padding:8px 14px;
    border-radius:8px;
    cursor:pointer;
    display:flex;align-items:center;gap:6px;
    font-family:var(--font);
  }
  button.ghost:hover{border-color:var(--teal-400);color:var(--teal-800);}

  /* cards / grid */
  .card{
    background:var(--bg-card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px 18px;
  }
  .grid{display:grid;gap:14px;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-2{grid-template-columns:repeat(2,1fr);}
  @media(max-width:980px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}}

  .metric-card .label{font-size:12.5px;color:var(--ink-mute);margin-bottom:6px;}
  .metric-card .value{font-size:24px;font-weight:500;color:var(--ink);}
  .metric-card .delta{font-size:11.5px;color:var(--teal-600);margin-top:4px;}

  .section-title{
    font-size:14px;
    font-weight:500;
    margin:26px 0 10px;
    color:var(--ink);
  }
  .section-title:first-child{margin-top:0;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{
    text-align:left;
    background:var(--blue-50);
    color:var(--blue-800);
    font-weight:500;
    padding:9px 12px;
    white-space:nowrap;
  }
  tbody td{
    padding:9px 12px;
    border-top:1px solid var(--line);
    color:var(--ink-soft);
  }
  tbody tr:hover{background:#fafcfb;}
  .tag{
    display:inline-block;
    font-size:11px;
    padding:2px 8px;
    border-radius:999px;
  }
  .tag.pdf{background:var(--blue-50);color:var(--blue-800);}
  .tag.ai{background:var(--teal-50);color:var(--teal-800);}
  .tag.manual{background:var(--amber-50);color:var(--amber-600);}
  .tag.high{background:var(--red-50);color:var(--red-600);}
  .tag.low{background:var(--teal-50);color:var(--teal-800);}
  .row-actions i{font-size:15px;color:var(--ink-mute);margin-right:10px;cursor:pointer;}
  .row-actions i:hover{color:var(--teal-700);}

  .filter-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  select, input[type=text], input[type=number]{
    font-family:var(--font);
    font-size:13px;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:8px;
    background:#fff;
    color:var(--ink);
  }
  select{min-width:110px;}
  input[type=text]{flex:1;min-width:160px;}

  .upload-box{
    border:1.5px dashed var(--line);
    border-radius:var(--radius);
    padding:36px 20px;
    text-align:center;
    color:var(--ink-mute);
    font-size:13px;
    background:#fafcfb;
  }
  .upload-box i{font-size:28px;color:var(--teal-400);display:block;margin-bottom:10px;}
  .filetypes{display:flex;gap:8px;justify-content:center;margin-top:12px;}
  .filetypes span{
    font-size:11px;
    padding:3px 9px;
    border-radius:6px;
    background:var(--teal-50);
    color:var(--teal-800);
  }

  .weak-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:12.5px;}
  .weak-bar-row .unit-name{width:110px;flex-shrink:0;color:var(--ink-soft);}
  .weak-bar-track{flex:1;height:10px;background:var(--line);border-radius:6px;overflow:hidden;}
  .weak-bar-fill{height:100%;border-radius:6px;}
  .weak-bar-pct{width:38px;text-align:right;color:var(--ink-mute);flex-shrink:0;}

  .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-top:1px solid var(--line);font-size:13px;}
  .toggle-row:first-child{border-top:none;}
  .switch{width:36px;height:20px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;flex-shrink:0;}
  .switch.on{background:var(--teal-600);}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;background:#fff;border-radius:50%;transition:transform .15s;}
  .switch.on::after{transform:translateX(16px);}

  .placeholder-card{
    background:var(--bg-card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:40px 24px;
    text-align:center;
    color:var(--ink-mute);
    font-size:13px;
  }
  .placeholder-card i{font-size:26px;color:var(--teal-200);display:block;margin-bottom:10px;}

  .badge-locked{
    font-size:11px;
    color:var(--amber-600);
    background:var(--amber-50);
    padding:2px 8px;
    border-radius:999px;
    margin-left:8px;
  }
  .perm-note{
    font-size:12px;
    color:var(--ink-mute);
    background:var(--amber-50);
    border:1px solid #f0d9a8;
    border-radius:8px;
    padding:10px 14px;
    margin-bottom:16px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .perm-note i{color:var(--amber-600);font-size:15px;}

  .announce-item{
    padding:12px 0;
    border-top:1px solid var(--line);
  }
  .announce-item:first-child{border-top:none;}
  .announce-item .a-title{font-size:13.5px;font-weight:500;color:var(--ink);margin-bottom:3px;}
  .announce-item .a-meta{font-size:11.5px;color:var(--ink-mute);}

  .fk-list{display:flex;flex-direction:column;gap:10px;}
  .fk-item{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border:1px solid var(--line);border-radius:8px;}
  .fk-item .fk-title{font-size:13px;color:var(--ink);}
  .fk-item .fk-sub{font-size:11.5px;color:var(--ink-mute);margin-top:2px;}

  footer.footbar{
    text-align:center;
    padding:16px;
    background:var(--header-bg);
    color:rgba(4,52,44,0.75);
    font-size:11.5px;
    flex-shrink:0;
  }

  /* ---------- Login page ---------- */
  .login-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(180deg, var(--teal-50) 0%, var(--bg-page) 100%);
    padding:24px;
  }
  .login-card{
    width:100%;
    max-width:380px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:16px;
    padding:36px 32px;
    box-shadow:0 4px 24px rgba(4,52,44,0.06);
  }
  .login-logo{
    display:flex;
    align-items:center;
    gap:10px;
    justify-content:center;
    margin-bottom:6px;
  }
  .login-logo i{font-size:26px;color:var(--teal-600);}
  .login-logo span{font-size:16px;font-weight:500;color:var(--ink);}
  .login-sub{
    text-align:center;
    font-size:12.5px;
    color:var(--ink-mute);
    margin-bottom:26px;
  }
  .login-field{margin-bottom:14px;}
  .login-field label{
    display:block;
    font-size:12.5px;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .login-field input{
    width:100%;
    padding:10px 12px;
  }
  .login-role-select{
    display:flex;
    gap:6px;
    margin-bottom:18px;
    background:var(--teal-50);
    padding:4px;
    border-radius:8px;
  }
  .login-role-select button{
    flex:1;
    border:none;
    background:transparent;
    padding:7px 4px;
    font-size:12px;
    border-radius:6px;
    cursor:pointer;
    font-family:var(--font);
    color:var(--teal-800);
  }
  .login-role-select button.active{
    background:#fff;
    font-weight:500;
    box-shadow:0 1px 3px rgba(4,52,44,0.1);
  }
  .login-btn{
    width:100%;
    justify-content:center;
    padding:11px;
    font-size:13.5px;
    margin-top:4px;
  }
  .login-foot{
    text-align:center;
    font-size:11.5px;
    color:var(--ink-mute);
    margin-top:18px;
  }

  ::-webkit-scrollbar{height:8px;width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}

  /* ---------- Exam taking screen ---------- */
  .exam-topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 20px;
    margin-bottom:16px;
  }
  .exam-title{font-size:15px;font-weight:500;color:var(--ink);}
  .exam-sub{font-size:12px;color:var(--ink-mute);margin-top:2px;}
  .exam-timer{
    display:flex;align-items:center;gap:8px;
    font-size:16px;font-weight:500;
    color:var(--red-600);
    background:var(--red-50);
    padding:8px 16px;
    border-radius:999px;
  }
  .exam-body{display:flex;gap:18px;align-items:flex-start;}
  .exam-main{flex:1;min-width:0;}
  .exam-side{width:230px;flex-shrink:0;}
  .exam-question-card{padding:26px 28px;}
  .exam-q-text{font-size:15.5px;color:var(--ink);line-height:1.7;margin-bottom:22px;}
  .exam-options{display:flex;flex-direction:column;gap:10px;}
  .exam-option{
    display:flex;
    align-items:center;
    gap:12px;
    padding:13px 16px;
    border:1px solid var(--line);
    border-radius:10px;
    cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .exam-option:hover{border-color:var(--teal-400);background:var(--teal-50);}
  .exam-option.selected{border-color:var(--teal-600);background:var(--teal-50);}
  .exam-option input{margin:0;accent-color:var(--teal-600);flex-shrink:0;}
  .exam-opt-letter{
    width:24px;height:24px;
    border-radius:50%;
    background:var(--blue-50);
    color:var(--blue-800);
    font-size:12px;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    font-weight:500;
  }
  .exam-option.selected .exam-opt-letter{background:var(--teal-600);color:#fff;}
  .exam-opt-text{font-size:13.5px;color:var(--ink-soft);}
  .exam-nav-buttons{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:18px;
  }
  .exam-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:8px;
    margin-bottom:14px;
  }
  .exam-num{
    aspect-ratio:1;
    border:1px solid var(--line);
    background:#fff;
    border-radius:8px;
    font-size:12.5px;
    color:var(--ink-soft);
    cursor:pointer;
    font-family:var(--font);
  }
  .exam-num.done{background:var(--teal-50);border-color:var(--teal-200);color:var(--teal-800);}
  .exam-num.current{background:var(--teal-600);border-color:var(--teal-600);color:#fff;font-weight:500;}
  .exam-legend{display:flex;flex-direction:column;gap:6px;font-size:11.5px;color:var(--ink-mute);}
  .exam-legend div{display:flex;align-items:center;gap:7px;}
  .exam-legend .dot{width:9px;height:9px;border-radius:3px;flex-shrink:0;}
  .exam-legend .dot.done{background:var(--teal-200);}
  .exam-legend .dot.current{background:var(--teal-600);}
  .exam-legend .dot.todo{background:var(--line);}
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="login-logo"><i class="ti ti-books"></i><span>教育大市集</span></div>
    <div class="login-sub">智慧題庫管理與學習分析系統</div>

    <div class="login-role-select" id="loginRoleSelect">
      <button class="active" data-role="teacher">老師</button>
      <button data-role="assistant">小老師</button>
      <button data-role="student">學生</button>
      <button data-role="admin">管理者</button>
    </div>

    <div class="login-field">
      <label>帳號</label>
      <input type="text" placeholder="請輸入帳號">
    </div>
    <div class="login-field">
      <label>密碼</label>
      <input type="password" placeholder="請輸入密碼">
    </div>

    <button class="primary login-btn" id="loginSubmit"><i class="ti ti-login-2"></i>登入</button>
    <div class="login-foot">忘記密碼？請聯絡系統管理員</div>
  </div>
</div>

<div class="app" id="mainApp" style="display:none;">

  <header class="topbar">
    <div class="brand"><i class="ti ti-books"></i>教育大市集｜智慧題庫管理與學習分析系統</div>
    <div class="role-switcher" id="roleSwitcher">
      <button class="role-btn active" data-role="teacher">老師</button>
      <button class="role-btn" data-role="assistant">小老師</button>
      <button class="role-btn" data-role="student">學生</button>
      <button class="role-btn" data-role="admin">管理者</button>
    </div>
    <div class="topbar-right">
      <div class="icon-btn"><i class="ti ti-bell"></i><span class="dot"></span></div>
      <div class="user-chip" id="userChip">
        <div class="avatar" id="userAvatar">王</div>
        <span id="userName">王老師</span>
        <i class="ti ti-chevron-down" style="font-size:14px;opacity:0.6;"></i>
      </div>
    </div>
  </header>

  <div class="body-wrap">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="content" id="content"></main>
  </div>

  <footer class="footbar">© 2026 教育大市集（Education Marketplace）· 智慧題庫管理與學習分析系統</footer>
</div>

<script>
/* ============ Role & Nav Config ============ */
const roles = {
  teacher: {
    name: "王老師", avatar: "王",
    nav: [
      {id:"t-dash", icon:"ti-layout-dashboard", label:"儀表板"},
      {id:"t-import", icon:"ti-upload", label:"題庫匯入"},
      {id:"t-bank", icon:"ti-folder", label:"題庫管理"},
      {id:"t-folder", icon:"ti-files", label:"學習資料夾"},
      {id:"t-paper", icon:"ti-clipboard-list", label:"固定試卷"},
      {id:"t-analysis", icon:"ti-chart-bar", label:"成效分析"},
      {id:"t-perm", icon:"ti-users", label:"小老師權限"},
      {id:"t-announce", icon:"ti-speakerphone", label:"課程公告"},
      {id:"t-course", icon:"ti-school", label:"課程管理"},
    ],
    default:"t-dash"
  },
  assistant: {
    name: "李小老師", avatar: "李",
    nav: [
      {id:"a-dash", icon:"ti-layout-dashboard", label:"儀表板"},
      {id:"a-import", icon:"ti-upload", label:"題庫匯入", locked:true},
      {id:"a-bank", icon:"ti-folder", label:"題庫管理", locked:true},
      {id:"a-folder", icon:"ti-files", label:"跨文件統整測驗", locked:true},
      {id:"a-announce", icon:"ti-speakerphone", label:"課程公告"},
    ],
    default:"a-dash"

/* ============ Render sidebar ============ */
function renderSidebar(roleKey){
  const role = roles[roleKey];
  const sidebar = document.getElementById('sidebar');
  sidebar.innerHTML = '<div class="side-section-label">功能選單</div>' +
    role.nav.map(item => `
      <div class="nav-item" data-panel="${item.id}">
        <i class="ti ${item.icon}"></i>
        <span>${item.label}</span>
        ${item.locked ? '<span class="nav-note">需授權</span>' : ''}
      </div>
    `).join('');

  sidebar.querySelectorAll('.nav-item').forEach(el=>{
    el.addEventListener('click', ()=> showPanel(el.dataset.panel));
  });
}

function showPanel(panelId){
  document.querySelectorAll('.nav-item').forEach(el=>{
    el.classList.toggle('active', el.dataset.panel === panelId);
  });
  document.querySelectorAll('.panel').forEach(el=>{
    el.classList.toggle('active', el.id === panelId);
  });
}

const roleLabel = {teacher:"老師", assistant:"小老師", student:"學生", admin:"管理者"};

function switchRole(roleKey){
  document.querySelectorAll('.role-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.role === roleKey);
  });
  const role = roles[roleKey];
  document.getElementById('userName').textContent = role.name;
  document.getElementById('userAvatar').textContent = role.avatar;
  renderSidebar(roleKey);
  showPanel(role.default);

  const pName = document.getElementById('profileName');
  const pAvatar = document.getElementById('profileAvatar');
  const pRole = document.getElementById('profileRole');
  if(pName){ pName.textContent = role.name; pAvatar.textContent = role.avatar; pRole.textContent = roleLabel[roleKey]; }
}

document.getElementById('roleSwitcher').addEventListener('click', e=>{
  const btn = e.target.closest('.role-btn');
  if(btn) switchRole(btn.dataset.role);
});

/* ============ Login ============ */
let loginRole = 'teacher';
document.getElementById('loginRoleSelect').addEventListener('click', e=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  document.querySelectorAll('#loginRoleSelect button').forEach(b=>b.classList.toggle('active', b===btn));
  loginRole = btn.dataset.role;
});
document.getElementById('loginSubmit').addEventListener('click', ()=>{
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('mainApp').style.display = 'flex';
  switchRole(loginRole);
});

/* ============ Profile page ============ */
document.getElementById('userChip').addEventListener('click', ()=>{
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(el=>el.classList.remove('active'));
  document.getElementById('profile-panel').classList.add('active');
});
</script>
