# ============================================================
# 智慧題庫管理系統 — Spring Boot Configuration
# ============================================================

# Server
server.port=8080

# ── SQL Server 資料庫設定（請依實際環境修改） ──────────────
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=SelfLearningDB;encrypt=false;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
# update = 自動同步 Schema（勿在正式環境使用 create-drop）
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 啟動時執行 schema.sql（若使用 ddl-auto=none 時手動建表）
# spring.sql.init.mode=always
# spring.sql.init.schema-locations=classpath:schema.sql

# 檔案上傳與連線吞吐大小限制（提升至 500MB / 1000MB，防止大檔案中斷連線）
server.tomcat.max-swallow-size=1000MB
server.tomcat.max-http-form-post-size=1000MB
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=1000MB

# 日誌
logging.level.com.edu.questionbank=DEBUG
logging.level.org.springframework.web=INFO

# ── Google Gemini API 設定 ──────────────────────────────────
# 可透過環境變數 GEMINI_API_KEY 提供金鑰；若未設定則自動啟用 Mock 回退機制
google.gemini.api.key=${GEMINI_API_KEY:}
google.gemini.model=gemini-3.6-flash
google.gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models

